# 用 GitHub 的机器调云端 TTS(OpenAI / 千问 DashScope / 火山 seed-audio / 百炼 CosyVoice 声音复刻)生成语音。
# (写这个工作流的原因:Claude 云端沙箱的出网策略连不到这些 API,GitHub Actions 的机器可以。)
#
# 一次性准备:仓库 Settings → Secrets and variables → Actions → New repository secret
#             OpenAI 填 OPENAI_API_KEY,千问填 DASHSCOPE_API_KEY,火山 seed-audio 填 VOLC_TTS_API_KEY。key 只存在 GitHub 的加密 secret 里,不进仓库、不进日志。
# 运行:Actions 页签 → "Generate voices (OpenAI / Qwen)" → Run workflow → 选分支、provider、case → Run;
#       或改 .github/tts-request.yml 后 push。大约 3‒5 分钟,生成的 wav + mp3 自动提交回该分支,并触发 GitHub Pages 重新发布。
name: Generate voices (OpenAI / Qwen)

on:
  # 两种启动方式:Actions 页签手动 Run workflow;或改动 .github/tts-request.yml 后 push(Claude 会话里 push 也能启动)
  push:
    paths: ['.github/tts-request.yml']
  workflow_dispatch:
    inputs:
      provider:
        description: '语音引擎'
        type: choice
        options: [openai, qwen, volc, cosy]
        default: openai
      case:
        description: 'case id(cases/ 下的目录名)'
        default: morning
        required: true
      force:
        description: '已有语音也重做(用来把离线音色换成 OpenAI 音色)'
        type: boolean
        default: true
      only:
        description: '只生成这些台词 id,逗号分隔;留空 = 全部'
        default: ''
      model:
        description: 'TTS 模型;留空按引擎默认(OpenAI gpt-4o-mini-tts,千问 qwen3-tts-flash)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 读取参数(手动运行用 inputs;push 触发读 .github/tts-request.yml)
        id: req
        run: |
          get() { sed -n "s/^$1:[[:space:]]*//p" .github/tts-request.yml | head -1 | tr -d '\r"'; }
          CASE="${{ inputs.case }}";   [ -n "$CASE" ]  || CASE="$(get case)";   [ -n "$CASE" ] || CASE=morning
          FORCE="${{ inputs.force }}"; [ -n "$FORCE" ] || FORCE="$(get force)"
          ONLY="${{ inputs.only }}";   [ -n "$ONLY" ]  || ONLY="$(get only)"
          PROVIDER="${{ inputs.provider }}"; [ -n "$PROVIDER" ] || PROVIDER="$(get provider)"; [ -n "$PROVIDER" ] || PROVIDER=openai
          MODEL="${{ inputs.model }}"; [ -n "$MODEL" ] || MODEL="$(get model)"
          if [ -z "$MODEL" ]; then case "$PROVIDER" in qwen) MODEL=qwen3-tts-flash ;; volc) MODEL=seed-audio-1.0 ;; cosy) MODEL=cosyvoice-v2 ;; *) MODEL=gpt-4o-mini-tts ;; esac; fi
          case "$PROVIDER" in openai) SECRET=OPENAI_API_KEY ;; qwen|cosy) SECRET=DASHSCOPE_API_KEY ;; volc) SECRET=VOLC_TTS_API_KEY ;; *) echo "::error::provider 只能是 openai / qwen / volc / cosy(现在是 $PROVIDER)"; exit 1 ;; esac
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET"     >> "$GITHUB_OUTPUT"
          echo "case=$CASE"   >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY"   >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "provider=$PROVIDER case=$CASE force=$FORCE only=$ONLY model=$MODEL"

      - name: 检查 API key secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          VOLC_TTS_API_KEY: ${{ secrets.VOLC_TTS_API_KEY }}
          VOLC_APP_ID: ${{ secrets.VOLC_APP_ID }}
          VOLC_ACCESS_TOKEN: ${{ secrets.VOLC_ACCESS_TOKEN }}
          SECRET: ${{ steps.req.outputs.secret }}
        run: |
          KEY="${!SECRET}"
          if [ "$SECRET" = VOLC_TTS_API_KEY ] && [ -z "$KEY" ] && [ -n "$VOLC_APP_ID" ] && [ -n "$VOLC_ACCESS_TOKEN" ]; then KEY="$VOLC_APP_ID:$VOLC_ACCESS_TOKEN"; echo "用 VOLC_APP_ID + VOLC_ACCESS_TOKEN 鉴权"; fi
          if [ -z "$KEY" ]; then
            echo "::error::没有找到 $SECRET。到 https://github.com/${{ github.repository }}/settings/secrets/actions 新建 repository secret(Name = $SECRET),再重新运行这个工作流。"
            exit 1
          fi
          echo "$SECRET 已配置(长度 ${#KEY})"

      - name: ffmpeg(火山母带解码 / mp3 压缩版)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }

      - name: 缓存识别模型(火山对齐用,≈1GB,只下一次)
        if: steps.req.outputs.provider == 'volc'
        uses: actions/cache@v4
        with:
          path: .cache/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
          key: sensevoice-2024-07-17

      - name: 生成语音
        id: gen
        continue-on-error: true            # 部分失败也把已生成的句子提交回去;最后一步再把失败报出来
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
          VOLC_TTS_API_KEY: ${{ secrets.VOLC_TTS_API_KEY }}
          VOLC_APP_ID: ${{ secrets.VOLC_APP_ID }}
          VOLC_ACCESS_TOKEN: ${{ secrets.VOLC_ACCESS_TOKEN }}
          VOLC_RESOURCE_ID: ${{ vars.VOLC_RESOURCE_ID }}
        run: |
          if [ "${{ steps.req.outputs.provider }}" = cosy ]; then
            # 声音复刻(阿里云百炼 CosyVoice):cases/<case>/audio/ref_<speaker>.wav 先复刻成音色,再逐句合成
            pip install -q dashscope
            args="${{ steps.req.outputs.case }} --model ${{ steps.req.outputs.model }}"
            if [ "${{ steps.req.outputs.force }}" = "true" ]; then args="$args --force"; fi
            if [ -n "${{ steps.req.outputs.only }}" ]; then args="$args --only ${{ steps.req.outputs.only }}"; fi
            python3 tools/cosyvoice_tts.py auto $args
          else
            args="${{ steps.req.outputs.case }} --provider ${{ steps.req.outputs.provider }} --model ${{ steps.req.outputs.model }}"
            if [ "${{ steps.req.outputs.force }}" = "true" ]; then args="$args --force"; fi
            if [ -n "${{ steps.req.outputs.only }}" ]; then args="$args --only ${{ steps.req.outputs.only }}"; fi
            node server/cli.js tts $args
          fi

      - name: 识别对齐重切(火山整段母带:SenseVoice 逐字对齐剧本,修正纯静音切分的错切)
        if: steps.req.outputs.provider == 'volc' && steps.gen.outcome == 'success' && steps.req.outputs.only != 'ambience'
        continue-on-error: true
        env:
          SENSEVOICE_DIR: ${{ github.workspace }}/.cache/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
        run: |
          pip install -q sherpa-onnx numpy imageio-ffmpeg
          python3 tools/align_clips.py "${{ steps.req.outputs.case }}"
          node server/cli.js recut "${{ steps.req.outputs.case }}"

      - name: 保存生成结果(即使后面步骤失败也能从 Artifacts 下载)
        if: always() && steps.gen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ steps.req.outputs.case }}
          path: cases/${{ steps.req.outputs.case }}/audio
          retention-days: 7

      - name: mp3 压缩版(单文件包 / 网页只带这份,wav 留作母带)
        continue-on-error: true
        run: |
          for f in cases/${{ steps.req.outputs.case }}/audio/*.wav; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in ref_*|master_*) continue ;; esac     # 参考样本 / 母带不做 mp3
            [ -e "${f%.wav}.mp3" ] && continue          # 没重做的句子已有 mp3,跳过
            ffmpeg -y -loglevel error -i "$f" -codec:a libmp3lame -b:a 64k "${f%.wav}.mp3"
          done
          ls cases/${{ steps.req.outputs.case }}/audio | wc -l

      - name: 提交回分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/${{ steps.req.outputs.case }}/audio
          if git diff --cached --quiet; then echo "没有变化,不提交"; exit 0; fi
          git commit -m "语音:${{ steps.req.outputs.provider }} ${{ steps.req.outputs.model }} 生成 ${{ steps.req.outputs.case }}(GitHub Actions 运行 ${{ github.run_number }})"
          git checkout -- . && git clean -fdq              # 丢掉其它 case 清单因 mtime 变化被重写的噪音,否则 rebase 拒绝
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: 触发 GitHub Pages 重新发布(GITHUB_TOKEN 的 push 不会自动触发别的工作流)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

      - name: 生成步骤有失败的句子
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::有句子没生成成功(看上面「生成语音」一步的日志);已生成的部分已经提交。修好后用 only 参数只重跑失败的句子。"
          exit 1
