# 把单文件演示发布到 GitHub Pages，得到一个公开、可直接播放的在线地址。
# 首次使用:仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
#
# 为什么不用 Artifact:Artifact 的沙箱 CSP 会拦掉 data: 媒体,
# 时间线用 new Audio(data:...) 播放、合成面板用 fetch(data:...) 读取,两条都被静默挡住,
# 页面能开但没有声音。Pages 是普通静态站点,没有这层限制,也没有 16 MB 上限。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/synthesis-add-test-cases-hcv1l3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg(音频转码要用)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - name: 校验全部 Case 包
        run: |
          for d in case-packages/*/; do npm run --silent case:validate -- "$d"; done
      - name: 构建单文件页面
        run: npm run build:local
      - name: 内嵌音频转 FLAC 并放进站点目录
        run: |
          mkdir -p site
          python3 local/shrink_audio.py \
            "$(dirname "$GITHUB_WORKSPACE")/Track Studio Local/Track Studio.html" \
            site/index.html
          ls -la site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# Pages 站点与部署分支均已放开后重新部署
